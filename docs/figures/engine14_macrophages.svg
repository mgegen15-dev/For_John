<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="860" height="270" font-family="system-ui, sans-serif" font-size="13" role="img" aria-label="Tumour macrophage gene score and outcome, discovery and independent cohorts">
<rect width="860" height="270" fill="#ffffff"/>
<text x="16" y="26" font-weight="600" fill="#1d2430">Tumour macrophage gene score and outcome: hazard ratio per standard deviation</text>
<text x="16" y="44" fill="#525b6b" font-size="12">95% CI, log scale. Left of 1: better outcome with more macrophage signal.</text>
<line x1="330.0" y1="58" x2="330.0" y2="224" stroke="#e2e5ea"/>
<text x="330.0" y="240" text-anchor="middle" fill="#525b6b" font-size="12">0.25</text>
<line x1="438.4" y1="58" x2="438.4" y2="224" stroke="#e2e5ea"/>
<text x="438.4" y="240" text-anchor="middle" fill="#525b6b" font-size="12">0.5</text>
<line x1="546.7" y1="58" x2="546.7" y2="224" stroke="#525b6b"/>
<text x="546.7" y="240" text-anchor="middle" fill="#525b6b" font-size="12">1</text>
<line x1="655.1" y1="58" x2="655.1" y2="224" stroke="#e2e5ea"/>
<text x="655.1" y="240" text-anchor="middle" fill="#525b6b" font-size="12">2</text>
<text x="16" y="83.0" fill="#1d2430" font-weight="400">Discovery: GSE21257 (Leiden), check</text>
<line x1="417.3" y1="79.0" x2="532.5" y2="79.0" stroke="#6a7384" stroke-width="2"/>
<circle cx="474.9" cy="79.0" r="5" fill="#6a7384"/>
<text x="850" y="83.0" text-anchor="end" fill="#525b6b" font-size="12">0.63 (0.44–0.91)</text>
<text x="16" y="113.0" fill="#1d2430" font-weight="400">GSE16091 (15 events)</text>
<line x1="450.0" y1="109.0" x2="617.4" y2="109.0" stroke="#1c5cab" stroke-width="2"/>
<circle cx="533.7" cy="109.0" r="5" fill="#1c5cab"/>
<text x="850" y="113.0" text-anchor="end" fill="#525b6b" font-size="12">0.92 (0.54–1.57)</text>
<text x="16" y="143.0" fill="#1d2430" font-weight="400">GSE39055 (18 events)</text>
<line x1="496.0" y1="139.0" x2="677.0" y2="139.0" stroke="#1c5cab" stroke-width="2"/>
<circle cx="586.5" cy="139.0" r="5" fill="#1c5cab"/>
<text x="850" y="143.0" text-anchor="end" fill="#525b6b" font-size="12">1.29 (0.72–2.30)</text>
<text x="16" y="173.0" fill="#1d2430" font-weight="400">TARGET-OS (41 events)</text>
<line x1="453.2" y1="169.0" x2="546.9" y2="169.0" stroke="#1c5cab" stroke-width="2"/>
<circle cx="500.1" cy="169.0" r="5" fill="#1c5cab"/>
<text x="850" y="173.0" text-anchor="end" fill="#525b6b" font-size="12">0.74 (0.55–1.00)</text>
<text x="16" y="203.0" fill="#1d2430" font-weight="600">Pooled, three independent cohorts</text>
<line x1="484.1" y1="199.0" x2="558.7" y2="199.0" stroke="#14264a" stroke-width="2"/>
<circle cx="521.4" cy="199.0" r="5" fill="#14264a"/>
<text x="850" y="203.0" text-anchor="end" fill="#525b6b" font-size="12">0.85 (0.67–1.08)</text>
</svg>