<text x="28" y="129" fill="#1d2430">12 to 17</text>
<rect x="230" y="118" width="8.4" height="15" fill="#1c5cab"/>
<text x="244.4" y="130" fill="#525b6b" font-size="12">25 (2%)</text>
<text x="28" y="155" fill="#1d2430">no minimum stated</text>
<rect x="230" y="144" width="4.4" height="15" fill="#1c5cab"/>
<text x="240.4" y="156" fill="#525b6b" font-size="12">13 (1%)</text>
<text x="28" y="181" fill="#1d2430">18</text>
<rect x="230" y="170" width="444.2" height="15" fill="#6a7384"/>
<text x="680.2" y="182" fill="#525b6b" font-size="12">1327 (93%)</text>
<text x="28" y="207" fill="#1d2430">over 18</text>
<rect x="230" y="196" width="9.4" height="15" fill="#6a7384"/>
<text x="245.4" y="208" fill="#525b6b" font-size="12">28 (2%)</text>
<text x="16" y="240" font-weight="600" fill="#1d2430">Trials naming osteosarcoma, relapse-eligible (69 trials)</text>
<text x="28" y="267" fill="#1d2430">under 12</text>
<rect x="230" y="256" width="201.7" height="15" fill="#1c5cab"/>
<text x="437.7" y="268" fill="#525b6b" font-size="12">29 (42%)</text>
<text x="28" y="293" fill="#1d2430">12 to 17</text>
<rect x="230" y="282" width="104.3" height="15" fill="#1c5cab"/>
<text x="340.3" y="294" fill="#525b6b" font-size="12">15 (22%)</text>
<text x="28" y="319" fill="#1d2430">no minimum stated</text>
<rect x="230" y="308" width="62.6" height="15" fill="#1c5cab"/>
