<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 398" width="820" height="398" font-family="system-ui, sans-serif" font-size="13" role="img" aria-label="Minimum age to enter recruiting drug trials">
<rect width="820" height="398" fill="#ffffff"/>
<text x="16" y="26" font-weight="600" fill="#1d2430">Youngest age a recruiting drug trial accepts</text>
<text x="16" y="44" fill="#525b6b" font-size="12">Share of trials in each age band. Blue: bands that let in a 12- to 17-year-old.</text>
