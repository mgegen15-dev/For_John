<text x="28" y="345" fill="#1d2430">18</text>
<rect x="230" y="334" width="97.4" height="15" fill="#6a7384"/>
<text x="333.4" y="346" fill="#525b6b" font-size="12">14 (20%)</text>
<text x="28" y="371" fill="#1d2430">over 18</text>
<rect x="230" y="360" width="13.9" height="15" fill="#6a7384"/>
<text x="249.9" y="372" fill="#525b6b" font-size="12">2 (3%)</text>
