<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="system-ui, sans-serif" font-size="13" role="img" aria-label="Odds of a poor response to chemotherapy before surgery, per standard deviation">
<rect width="860" height="330" fill="#ffffff"/>
<text x="16" y="26" font-weight="600" fill="#1d2430">Poor response to chemotherapy before surgery: odds ratio per standard deviation</text>
<text x="16" y="44" fill="#525b6b" font-size="12">Pooled across three cohorts, 95% CI, log scale. Right of 1: poorer response.</text>
<line x1="330.0" y1="58" x2="330.0" y2="284" stroke="#e2e5ea"/>
<text x="330.0" y="300" text-anchor="middle" fill="#525b6b" font-size="12">0.25</text>
<line x1="420.0" y1="58" x2="420.0" y2="284" stroke="#e2e5ea"/>
<text x="420.0" y="300" text-anchor="middle" fill="#525b6b" font-size="12">0.5</text>
<line x1="510.0" y1="58" x2="510.0" y2="284" stroke="#525b6b"/>
<text x="510.0" y="300" text-anchor="middle" fill="#525b6b" font-size="12">1</text>
<line x1="600.0" y1="58" x2="600.0" y2="284" stroke="#e2e5ea"/>
<text x="600.0" y="300" text-anchor="middle" fill="#525b6b" font-size="12">2</text>
<line x1="690.0" y1="58" x2="690.0" y2="284" stroke="#e2e5ea"/>
<text x="690.0" y="300" text-anchor="middle" fill="#525b6b" font-size="12">4</text>
<text x="16" y="83.0" fill="#1d2430">H1: MYC RNA</text>
<line x1="515.8" y1="79.0" x2="623.5" y2="79.0" stroke="#1c5cab" stroke-width="2"/>
<circle cx="569.7" cy="79.0" r="5" fill="#1c5cab"/>
<text x="850" y="83.0" text-anchor="end" fill="#525b6b" font-size="12">1.58 (1.05–2.40)</text>
<text x="16" y="113.0" fill="#1d2430">H2: CCNE1 RNA</text>
<line x1="442.5" y1="109.0" x2="544.1" y2="109.0" stroke="#1c5cab" stroke-width="2"/>
<circle cx="493.3" cy="109.0" r="5" fill="#1c5cab"/>
<text x="850" y="113.0" text-anchor="end" fill="#525b6b" font-size="12">0.88 (0.59–1.30)</text>
<text x="16" y="143.0" fill="#1d2430">H3: 9p21 loss score (CDKN2A, MTAP)</text>
<line x1="486.4" y1="139.0" x2="606.5" y2="139.0" stroke="#1c5cab" stroke-width="2"/>
<circle cx="546.4" cy="139.0" r="5" fill="#1c5cab"/>
<text x="850" y="143.0" text-anchor="end" fill="#525b6b" font-size="12">1.32 (0.83–2.10)</text>
<text x="16" y="173.0" fill="#1d2430">   MYC alone</text>
<line x1="515.8" y1="169.0" x2="623.5" y2="169.0" stroke="#9aa3b2" stroke-width="2"/>
<circle cx="569.7" cy="169.0" r="5" fill="#9aa3b2"/>
<text x="850" y="173.0" text-anchor="end" fill="#525b6b" font-size="12">1.58 (1.05–2.40)</text>
<text x="16" y="203.0" fill="#1d2430">   CCNE1 alone</text>
<line x1="442.5" y1="199.0" x2="544.1" y2="199.0" stroke="#9aa3b2" stroke-width="2"/>
<circle cx="493.3" cy="199.0" r="5" fill="#9aa3b2"/>
<text x="850" y="203.0" text-anchor="end" fill="#525b6b" font-size="12">0.88 (0.59–1.30)</text>
<text x="16" y="233.0" fill="#1d2430">   CDKN2A alone</text>
<line x1="426.8" y1="229.0" x2="535.1" y2="229.0" stroke="#9aa3b2" stroke-width="2"/>
<circle cx="481.0" cy="229.0" r="5" fill="#9aa3b2"/>
<text x="850" y="233.0" text-anchor="end" fill="#525b6b" font-size="12">0.80 (0.53–1.21)</text>
<text x="16" y="263.0" fill="#1d2430">   MTAP alone</text>
<line x1="425.0" y1="259.0" x2="533.1" y2="259.0" stroke="#9aa3b2" stroke-width="2"/>
<circle cx="479.0" cy="259.0" r="5" fill="#9aa3b2"/>
<text x="850" y="263.0" text-anchor="end" fill="#525b6b" font-size="12">0.79 (0.52–1.19)</text>
</svg>