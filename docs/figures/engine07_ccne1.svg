<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14">
<rect width="900" height="388" fill="#ffffff"/>
<text x="16" y="28" font-size="16" font-weight="600" fill="#14181f">CCNE1 amplification in osteosarcoma, by where the sample came from</text>
<text x="16" y="50" font-size="13" fill="#525b6b">Share of patients with the gene amplified, 95% CI. One sample per patient.</text>
<text x="16" y="68" font-size="13" fill="#525b6b">Blue: metastasis or relapse. Grey: primary tumour. Pale: reference cohorts of primary tumours.</text>
