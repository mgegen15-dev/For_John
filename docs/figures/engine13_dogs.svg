<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" font-family="system-ui, sans-serif" font-size="13" role="img" aria-label="Hazard ratios for faster progression in 59 pet dogs with osteosarcoma">
<rect width="860" height="360" fill="#ffffff"/>
<text x="16" y="26" font-weight="600" fill="#1d2430">Faster progression in 59 pet dogs: hazard ratio per standard deviation</text>
<text x="16" y="44" fill="#525b6b" font-size="12">95% CI, log scale. Right of 1: faster progression with more of the measure.</text>
<line x1="330.0" y1="58" x2="330.0" y2="314" stroke="#e2e5ea"/>
<text x="330.0" y="330" text-anchor="middle" fill="#525b6b" font-size="12">0.25</text>
<line x1="420.0" y1="58" x2="420.0" y2="314" stroke="#e2e5ea"/>
<text x="420.0" y="330" text-anchor="middle" fill="#525b6b" font-size="12">0.5</text>
<line x1="510.0" y1="58" x2="510.0" y2="314" stroke="#525b6b"/>
<text x="510.0" y="330" text-anchor="middle" fill="#525b6b" font-size="12">1</text>
<line x1="600.0" y1="58" x2="600.0" y2="314" stroke="#e2e5ea"/>
<text x="600.0" y="330" text-anchor="middle" fill="#525b6b" font-size="12">2</text>
<line x1="690.0" y1="58" x2="690.0" y2="314" stroke="#e2e5ea"/>
<text x="690.0" y="330" text-anchor="middle" fill="#525b6b" font-size="12">4</text>
<text x="16" y="83.0" fill="#1d2430">Check: alkaline phosphatase (log)</text>
<line x1="494.7" y1="79.0" x2="577.1" y2="79.0" stroke="#6a7384" stroke-width="2"/>
<circle cx="535.9" cy="79.0" r="5" fill="#6a7384"/>
<text x="850" y="83.0" text-anchor="end" fill="#525b6b" font-size="12">1.22 (0.89–1.68)</text>
<text x="16" y="113.0" fill="#1d2430">Check: monocyte count</text>
<line x1="505.7" y1="109.0" x2="577.4" y2="109.0" stroke="#6a7384" stroke-width="2"/>
<circle cx="541.5" cy="109.0" r="5" fill="#6a7384"/>
<text x="850" y="113.0" text-anchor="end" fill="#525b6b" font-size="12">1.27 (0.97–1.68)</text>
<text x="16" y="143.0" fill="#1d2430">H1: inflammation score</text>
<line x1="500.4" y1="139.0" x2="575.4" y2="139.0" stroke="#1c5cab" stroke-width="2"/>
<circle cx="537.9" cy="139.0" r="5" fill="#1c5cab"/>
<text x="850" y="143.0" text-anchor="end" fill="#525b6b" font-size="12">1.24 (0.93–1.65)</text>
<text x="16" y="173.0" fill="#1d2430">H2: DKK1</text>
<line x1="457.5" y1="169.0" x2="539.7" y2="169.0" stroke="#1c5cab" stroke-width="2"/>
<circle cx="498.6" cy="169.0" r="5" fill="#1c5cab"/>
<text x="850" y="173.0" text-anchor="end" fill="#525b6b" font-size="12">0.92 (0.67–1.26)</text>
<text x="16" y="203.0" fill="#1d2430">H3: PTK2</text>
<line x1="481.5" y1="199.0" x2="558.8" y2="199.0" stroke="#1c5cab" stroke-width="2"/>
<circle cx="520.2" cy="199.0" r="5" fill="#1c5cab"/>
<text x="850" y="203.0" text-anchor="end" fill="#525b6b" font-size="12">1.08 (0.80–1.46)</text>
<text x="16" y="233.0" fill="#1d2430">   IL6 alone</text>
<line x1="470.8" y1="229.0" x2="547.5" y2="229.0" stroke="#9aa3b2" stroke-width="2"/>
<circle cx="509.1" cy="229.0" r="5" fill="#9aa3b2"/>
<text x="850" y="233.0" text-anchor="end" fill="#525b6b" font-size="12">0.99 (0.74–1.33)</text>
<text x="16" y="263.0" fill="#1d2430">   IL1B alone</text>
<line x1="514.8" y1="259.0" x2="580.4" y2="259.0" stroke="#9aa3b2" stroke-width="2"/>
<circle cx="547.6" cy="259.0" r="5" fill="#9aa3b2"/>
<text x="850" y="263.0" text-anchor="end" fill="#525b6b" font-size="12">1.34 (1.04–1.72)</text>
<text x="16" y="293.0" fill="#1d2430">   CXCL8 alone</text>
<line x1="492.8" y1="289.0" x2="564.7" y2="289.0" stroke="#9aa3b2" stroke-width="2"/>
<circle cx="528.8" cy="289.0" r="5" fill="#9aa3b2"/>
<text x="850" y="293.0" text-anchor="end" fill="#525b6b" font-size="12">1.16 (0.88–1.52)</text>
</svg>